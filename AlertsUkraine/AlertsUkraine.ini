; ==============================================================================
;  AlertsUkraine.ini  -  Ukraine air-raid alert widget (Rainmeter skin)
;
;  Data source : https://ubilling.net.ua/aerialalerts/
;  Install to  : %USERPROFILE%\Documents\Rainmeter\Skins\AlertsUkraine\AlertsUkraine.ini
;
;  INFORMATIONAL ONLY. Do not rely on this widget for safety decisions -
;  always follow official alert channels.
; ==============================================================================

[Rainmeter]
Update = 1000
AccurateText = 1
DynamicWindowSize = 1

[Metadata]
Name = Air Raid Alerts
Author = styxxll
Information = Shows air-raid alert status for selected regions.
Version = 1.0
License = Creative Commons BY-NC-SA 3.0

; ------------------------------------------------------------------------------
;  SETTINGS
; ------------------------------------------------------------------------------
[Variables]
RefreshSeconds=20
ApiUrl=https://ubilling.net.ua/aerialalerts/
IsMain=1

; Note that API caches for 3 s and allows max 2 requests/s per host, so never go below 5.

@Include=#@#Selections.inc

ColorAlert=235,64,52
ColorClear=67,190,102
ColorUnknown=140,145,155
TextAlert=ALERT
TextClear=Clear
TextUnknown=No data

Region1Name =
Region1Key =
Region2Name =
Region2Key =
Region3Name =
Region3Key =
Region4Name =
Region4Key =
Region5Name =
Region5Key =

R1Color=#ColorUnknown#
R1Text=#TextUnknown#
R2Color=#ColorUnknown#
R2Text=#TextUnknown#
R3Color=#ColorUnknown#
R3Text=#TextUnknown#
R4Color=#ColorUnknown#
R4Text=#TextUnknown#
R5Color=#ColorUnknown#
R5Text=#TextUnknown#
Sel3=26

; ------------------------------------------------------------------------------
;  MEASURES
; ------------------------------------------------------------------------------
[mLua]
Measure=Script
ScriptFile=#@#RegionManager.lua
UpdateDivider=-1

[mRaw]
Measure=WebParser
URL=#ApiUrl#
RegExp=(?siU)^(.*)$
UpdateRate=#RefreshSeconds#
CodePage=65001

[mRegion1]
Measure=WebParser
URL=[mRaw]
RegExp=(?si)"#Region1Key#"\s*:\s*\{\s*"alertnow"\s*:\s*(true|false)
StringIndex=1
StringIndex2=1
DynamicVariables=1
IfMatchMode=1
IfMatch=^true$
IfMatchAction=[!SetVariable R1Color "#ColorAlert#"][!SetVariable R1Text "#TextAlert#"]
IfNotMatchAction=[!SetVariable R1Color "#ColorUnknown#"][!SetVariable R1Text "#TextUnknown#"]
IfMatch2=^false$
IfMatchAction2=[!SetVariable R1Color "#ColorClear#"][!SetVariable R1Text "#TextClear#"]

[mRegion2]
Measure=WebParser
URL=[mRaw]
RegExp=(?si)"#Region2Key#"\s*:\s*\{\s*"alertnow"\s*:\s*(true|false)
StringIndex=1
StringIndex2=1
DynamicVariables=1
IfMatchMode=1
IfMatch=^true$
IfMatchAction=[!SetVariable R2Color "#ColorAlert#"][!SetVariable R2Text "#TextAlert#"]
IfNotMatchAction=[!SetVariable R2Color "#ColorUnknown#"][!SetVariable R2Text "#TextUnknown#"]
IfMatch2=^false$
IfMatchAction2=[!SetVariable R2Color "#ColorClear#"][!SetVariable R2Text "#TextClear#"]

[mRegion3]
Measure=WebParser
URL=[mRaw]
RegExp=(?si)"#Region3Key#"\s*:\s*\{\s*"alertnow"\s*:\s*(true|false)
StringIndex=1
StringIndex2=1
DynamicVariables=1
IfMatchMode=1
IfMatch=^true$
IfMatchAction=[!SetVariable R3Color "#ColorAlert#"][!SetVariable R3Text "#TextAlert#"]
IfNotMatchAction=[!SetVariable R3Color "#ColorUnknown#"][!SetVariable R3Text "#TextUnknown#"]
IfMatch2=^false$
IfMatchAction2=[!SetVariable R3Color "#ColorClear#"][!SetVariable R3Text "#TextClear#"]

[mRegion4]
Measure=WebParser
URL=[mRaw]
RegExp=(?si)"#Region4Key#"\s*:\s*\{\s*"alertnow"\s*:\s*(true|false)
StringIndex=1
StringIndex2=1
DynamicVariables=1
IfMatchMode=1
IfMatch=^true$
IfMatchAction=[!SetVariable R4Color "#ColorAlert#"][!SetVariable R4Text "#TextAlert#"]
IfNotMatchAction=[!SetVariable R4Color "#ColorUnknown#"][!SetVariable R4Text "#TextUnknown#"]
IfMatch2=^false$
IfMatchAction2=[!SetVariable R4Color "#ColorClear#"][!SetVariable R4Text "#TextClear#"]

[mRegion5]
Measure=WebParser
URL=[mRaw]
RegExp=(?si)"#Region5Key#"\s*:\s*\{\s*"alertnow"\s*:\s*(true|false)
StringIndex=1
StringIndex2=1
DynamicVariables=1
IfMatchMode=1
IfMatch=^true$
IfMatchAction=[!SetVariable R5Color "#ColorAlert#"][!SetVariable R5Text "#TextAlert#"]
IfNotMatchAction=[!SetVariable R5Color "#ColorUnknown#"][!SetVariable R5Text "#TextUnknown#"]
IfMatch2=^false$
IfMatchAction2=[!SetVariable R5Color "#ColorClear#"][!SetVariable R5Text "#TextClear#"]

; ------------------------------------------------------------------------------
;  STYLES
; ------------------------------------------------------------------------------
[StyleName]
FontFace=Segoe UI
FontSize=11
FontColor=230,232,236
AntiAlias=1
ClipString=1
W=190

[StyleStatus]
FontFace=Segoe UI
FontSize=11
StringStyle=Bold
StringAlign=Right
AntiAlias=1
DynamicVariables=1

; ------------------------------------------------------------------------------
;  MAIN INTERFACE
; ------------------------------------------------------------------------------
[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,280,200,10 | Fill Color 24,26,32,235 | StrokeWidth 0

[MeterTitle]
Meter=String
X=16
Y=10
FontFace=Segoe UI
FontSize=12
FontColor=255,255,255
StringStyle=Bold
AntiAlias=1
Text=Air Raid Alerts
ToolTipText=Open the full web version
LeftMouseUpAction=["#ApiUrl#?webalerts"]

[MeterSettings]
Meter = Image
ImageName = #@#Images\settings_icon.png
X = 246
Y = 8
W = 20
H = 20
ToolTipText = Settings
LeftMouseUpAction = [!ActivateConfig "AlertsUkraine\Settings" "Settings.ini" "0"]

[MeterDivider]
Meter=Shape
Shape=Line 16,36,264,36 | StrokeWidth 1 | Stroke Color 255,255,255,40

