[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name = Air Raid Alerts Settings
Author = styxxll
Information=  Region selection settings.
Version = 1.0

[Variables]
@Include=#@#Selections.inc
ApiUrl=https://ubilling.net.ua/aerialalerts/
RefreshSeconds=20

ColorBg=24,26,32,250
ColorText=230,232,236
ColorMuted=150,155,165
ColorAccent=100,170,255

; ------------------------------------------------------------------------------
;  MEASURES
; ------------------------------------------------------------------------------

[mLua]
Measure = Script
ScriptFile = #@#RegionManager.lua
UpdateDivider = -1

[mRaw]
Measure=WebParser
URL=#ApiUrl#
RegExp=(?siU)^(.*)$
UpdateRate=#RefreshSeconds#
CodePage=65001

[mUpdated]
Measure=WebParser
URL=[mRaw]
RegExp=(?si)"cachedat"\s*:\s*"\d{4}-\d\d-\d\d (\d\d:\d\d:\d\d)"
StringIndex=1
StringIndex2=1
Substitute="":"no data"

; ------------------------------------------------------------------------------
; INTERFACE
; ------------------------------------------------------------------------------

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,390,750,12 | Fill Color #ColorBg# | StrokeWidth 0

[MeterTitle]
Meter=String
X=20
Y=16
FontFace=Segoe UI
FontSize=14
FontColor=255,255,255
StringStyle=Bold
Text=Settings
AntiAlias=1

[MeterClose]
Meter=String
X=366
Y=16
StringAlign=Right
FontFace=Segoe UI Symbol
FontSize=16
FontColor=#ColorMuted#
Text = X
AntiAlias=1
ToolTipText=Close settings
LeftMouseUpAction=[!DeactivateConfig "AlertsUkraine\Settings" "Settings.ini"]

[MeterInfo]
Meter=String
X=20
Y=45
FontFace=Segoe UI
FontSize=9
FontColor=#ColorMuted#
Text = Select up to 5 regions to monitor
AntiAlias=1

[MeterCount]
Meter=String
X=370
Y=45
StringAlign=Right
FontFace=Segoe UI
FontSize=9
FontColor=#ColorAccent#
Text=Selected: 0/5
AntiAlias=1

[MeterLimit]
Meter=String
X=20
Y=68
FontFace=Segoe UI
FontSize=9
FontColor=235,64,52
Text=
Hidden=1
AntiAlias=1

[MeterDivider]
Meter=Shape
Shape=Line 16,718,364,718 | StrokeWidth 1 | Stroke Color 255,255,255,40

[MeterUpdated]
Meter=String
MeasureName=mUpdated
X=360
Y=725
StringAlign=Right
FontFace=Segoe UI
FontSize=9
FontColor=150,155,165
AntiAlias=1
Text= Last updated %1

[MeterCredits]
Meter=String
X=16
Y=725
StringAlign=Left
FontFace=Segoe UI
FontSize=9
FontColor=150,155,165
Text = Information from ubilling.net.ua
AntiAlias=1

